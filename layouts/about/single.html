{{ define "title" }}
{{ .Title }} | {{ .Site.Params.author.name }}
{{ end }}

{{ define "main" }}
<article class="content-padding about-content">
    {{ .Content }}
</article>

<style>
.content-padding {
    padding-top: 2rem;
}

.about-content {
    text-align: left;
}

.about-content h1,
.about-content h2,
.about-content h3,
.about-content h4,
.about-content h5,
.about-content h6 {
    text-align: center;
}

.about-content img {
    display: block;
    margin: 0 auto;
}
</style>
{{ end }}
